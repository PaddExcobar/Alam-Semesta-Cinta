<body class="relative min-h-screen flex flex-col justify-between overflow-hidden select-none">

                <svg class="w-4 h-4 fill-current text-pink-400" viewBox="0 0 24 24">

    <!-- Three.js Visual Engine Script -->
    <script>
        // Quotes array for interactive quotes feature
        const quotes = [
            "\"In the cosmic expanse of space and time, my heart orbits only around you.\"",
            "\"You are my favorite universe, infinite and enchanting.\"",
            "\"Even among a billion stars, your glow shines the brightest.\"",
            "\"Love is the gravity that holds our constellation together.\"",
            "\"Across endless galaxies, I would still find my way to you.\"",
            "\"You are the magic floating in my universe.\""
        ];
        let currentQuoteIdx = 0;

        // Theme colors array (Heart core color, inner glowing particles, cosmic background accent)
        const themes = [
            { name: "Magenta Romance", primary: 0xff1493, secondary: 0xff69b4, bgGlow: 0x4a0e2e, hexStr: "#ec4899" },
            { name: "Cosmic Crimson",  primary: 0xff0040, secondary: 0xff4d6d, bgGlow: 0x4a0014, hexStr: "#ff0040" },
            { name: "Violet Nebula",   primary: 0x9d4edd, secondary: 0xc77dff, bgGlow: 0x240046, hexStr: "#9d4edd" },
            { name: "Golden Starlight",primary: 0xffb703, secondary: 0xffd166, bgGlow: 0x3d2b00, hexStr: "#ffb703" },
            { name: "Cyber Cyan",      primary: 0x00f5d4, secondary: 0x7b2cbf, bgGlow: 0x003566, hexStr: "#00f5d4" }
        ];
        let currentThemeIdx = 0;

        // Rotation speed levels
        const speeds = [
            { label: "Normal Speed", mult: 1.0 },
            { label: "Fast Cosmic", mult: 2.2 },
            { label: "Gentle Breeze", mult: 0.4 }
        ];
        let currentSpeedIdx = 0;

        // Three.js Core Variables
        let scene, camera, renderer;
        let heartParticles, innerHeartParticles, starField, nebulaCloud;
        let heartGeometry;
        
        // Interaction variables
        let targetRotationX = 0;
        let targetRotationY = 0;
        let mouseX = 0;
        let mouseY = 0;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        
        const container = document.getElementById('webgl-container');

        // Initialize 3D Engine
        function initThreeJS() {
            // 1. Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030008, 0.015);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 45;

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 4. Create Objects
            createGlowing3DHeart();
            createStarfieldGalaxy();
            createNebulaGlow();

            // 5. Setup Listeners
            window.addEventListener('resize', onWindowResize, false);
            setupInteractions();

            // 6. Start Loop
            animate();
        }

        // Custom Texture Generator for glowing particle dots
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,105,180,0.4)');
            gradient.addColorStop(1, 'rgba(255,20,147,0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // 3D Heart Mathematical Geometry Generator using Parametric Heart Equations
        function createGlowing3DHeart() {
            const particleCount = 4500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const initialPositions = new Float32Array(particleCount * 3);

            const theme = themes[currentThemeIdx];
            const baseColor = new THREE.Color(theme.primary);
            const secColor = new THREE.Color(theme.secondary);

            for (let i = 0; i < particleCount; i++) {
                // Parametric 3D Heart formula
                // t in [0, 2PI], u in [-PI, PI]
                const t = Math.PI * (2 * Math.random() - 1);
                const u = Math.PI * (Math.random() - 0.5);

                // Parametric heart shape formula adaptation
                const x = 16 * Math.pow(Math.sin(t), 3) * Math.cos(u);
                const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                const z = 6 * Math.sin(t) * Math.sin(u);

                // Add slight randomness/thickness for 3D volumetric glowing depth
                const scatter = (Math.random() - 0.5) * 1.8;
                const finalX = (x + scatter) * 0.85;
                const finalY = (y + scatter) * 0.85;
                const finalZ = (z + scatter) * 0.85;

                positions[i * 3] = finalX;
                positions[i * 3 + 1] = finalY;
                positions[i * 3 + 2] = finalZ;

                initialPositions[i * 3] = finalX;
                initialPositions[i * 3 + 1] = finalY;
                initialPositions[i * 3 + 2] = finalZ;

                // Color interpolation for glowing core look
                const mixRatio = Math.random();
                const vertexColor = baseColor.clone().lerp(secColor, mixRatio);
                colors[i * 3] = vertexColor.r;
                colors[i * 3 + 1] = vertexColor.g;
                colors[i * 3 + 2] = vertexColor.b;

                // Size variation
                sizes[i] = Math.random() * 1.4 + 0.6;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.userData = { initialPositions: initialPositions };

            // Material with custom soft glowing particle map
            const pTexture = createParticleTexture();
            const material = new THREE.PointsMaterial({
                size: 1.2,
                vertexColors: true,
                map: pTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.95
            });

            heartParticles = new THREE.Points(geometry, material);
            scene.add(heartParticles);

            // Create denser inner core sparkle
            const innerCount = 1200;
            const innerGeo = new THREE.BufferGeometry();
            const innerPos = new Float32Array(innerCount * 3);

            for(let j = 0; j < innerCount; j++) {
                const idx = Math.floor(Math.random() * particleCount);
                innerPos[j*3] = positions[idx*3] * 0.75;
                innerPos[j*3+1] = positions[idx*3+1] * 0.75;
                innerPos[j*3+2] = positions[idx*3+2] * 0.75;
            }
            innerGeo.setAttribute('position', new THREE.BufferAttribute(innerPos, 3));
            
            const innerMat = new THREE.PointsMaterial({
                size: 0.8,
                color: 0xffffff,
                map: pTexture,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.8
            });

            innerHeartParticles = new THREE.Points(innerGeo, innerMat);
            heartParticles.add(innerHeartParticles);
        }

        // Create Galaxy Cosmic Starfield Background
        function createStarfieldGalaxy() {
            const count = 6000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const colorOptions = [0xffffff, 0xffb6c1, 0xdda0dd, 0x87cefa];

            for (let i = 0; i < count; i++) {
                // Distribute stars in a spiral galaxy shape + outer sphere
                const radius = Math.random() * 160 + 20;
                const theta = Math.random() * Math.PI * 2;
                const phi = (Math.random() - 0.5) * Math.PI;

                positions[i * 3] = radius * Math.cos(theta) * Math.cos(phi);
                positions[i * 3 + 1] = radius * Math.sin(phi);
                positions[i * 3 + 2] = radius * Math.sin(theta) * Math.cos(phi);

                // Random subtle star colors
                const c = new THREE.Color(colorOptions[Math.floor(Math.random() * colorOptions.length)]);
                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.7,
                vertexColors: true,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending
            });

            starField = new THREE.Points(geometry, material);
            scene.add(starField);
        }

        // Ambient Nebula Glow Background Mesh
        function createNebulaGlow() {
            const count = 300;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);

            for(let i=0; i<count; i++) {
                positions[i*3] = (Math.random() - 0.5) * 120;
                positions[i*3+1] = (Math.random() - 0.5) * 120;
                positions[i*3+2] = (Math.random() - 0.5) * 80 - 20;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                size: 14,
                color: themes[currentThemeIdx].bgGlow,
                map: createParticleTexture(),
                transparent: true,
                opacity: 0.15,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            nebulaCloud = new THREE.Points(geometry, material);
            scene.add(nebulaCloud);
        }

        // Mouse & Touch Orbiting Controls
        function setupInteractions() {
            const dom = renderer.domElement;

            // Touch / Mouse drag logic
            const onPointerDown = (e) => {
                isDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                previousMousePosition = { x: clientX, y: clientY };
            };

            const onPointerMove = (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                if (isDragging) {
                    const deltaX = clientX - previousMousePosition.x;
                    const deltaY = clientY - previousMousePosition.y;

                    targetRotationY += deltaX * 0.008;
                    targetRotationX += deltaY * 0.008;

                    previousMousePosition = { x: clientX, y: clientY };
                }

                // Subtle parallax for camera
                mouseX = (clientX / window.innerWidth - 0.5) * 2;
                mouseY = (clientY / window.innerHeight - 0.5) * 2;
            };

            const onPointerUp = (e) => {
                isDragging = false;
            };

            dom.addEventListener('mousedown', onPointerDown);
            dom.addEventListener('mousemove', onPointerMove);
            window.addEventListener('mouseup', onPointerUp);

            dom.addEventListener('touchstart', onPointerDown, { passive: true });
            dom.addEventListener('touchmove', onPointerMove, { passive: true });
            window.addEventListener('touchend', onPointerUp);

            // Screen Click / Tap for Spawning Floating 2D Hearts Burst
            window.addEventListener('click', (e) => {
                // Avoid trigger when clicking UI buttons
                if (e.target.closest('button') || e.target.closest('footer')) return;
                spawnHeartBurst(e.clientX, e.clientY);
            });
        }

        // Create floating heart UI elements on click
        function spawnHeartBurst(x, y) {
            const heartIcons = ['💖', '💗', '✨', '💕', '🌸', '❤️'];
            const burstCount = 6;

            for (let i = 0; i < burstCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'click-heart';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = `${x}px`;
                heart.style.top = `${y}px`;

                // Randomize trajectory variables
                const dx = (Math.random() - 0.5) * 140;
                const dr = (Math.random() - 0.5) * 90;
                heart.style.setProperty('--dx', `${dx}px`);
                heart.style.setProperty('--dr', `${dr}deg`);

                document.body.appendChild(heart);

                // Remove DOM node after animation finishes
                setTimeout(() => {
                    heart.remove();
                }, 2400);
            }
        }

        // Responsive Resizing
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Main Animation Loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const speedMult = speeds[currentSpeedIdx].mult;

            // 1. Continuous Heart Rotations & Pulsing Beat
            if (heartParticles) {
                // Smooth Drag Rotation Lerp
                heartParticles.rotation.y += (targetRotationY - heartParticles.rotation.y) * 0.05;
                heartParticles.rotation.x += (targetRotationX - heartParticles.rotation.x) * 0.05;

                // Base Idle Spin
                heartParticles.rotation.y += 0.005 * speedMult;

                // Heartbeat Pulse contraction/expansion formula
                const beat = 1 + Math.sin(elapsedTime * 3 * speedMult) * 0.05 + Math.pow(Math.sin(elapsedTime * 6 * speedMult), 2) * 0.03;
                heartParticles.scale.set(beat, beat, beat);

                // Dynamic particle subtle wave movement
                const positions = heartParticles.geometry.attributes.position.array;
                const initialPositions = heartParticles.geometry.userData.initialPositions;

                for (let i = 0; i < positions.length; i += 3) {
                    const wave = Math.sin(elapsedTime * 2 + initialPositions[i]) * 0.15;
                    positions[i] = initialPositions[i] + wave;
                    positions[i+1] = initialPositions[i+1] + wave;
                    positions[i+2] = initialPositions[i+2] + wave;
                }
                heartParticles.geometry.attributes.position.needsUpdate = true;
            }

            // 2. Cosmic Background Swirl
            if (starField) {
                starField.rotation.y -= 0.0006 * speedMult;
                starField.rotation.x += 0.0002 * speedMult;
            }

            if (nebulaCloud) {
                nebulaCloud.rotation.z += 0.001 * speedMult;
            }

            // 3. Smooth Gentle Camera Parallax
            camera.position.x += (mouseX * 2 - camera.position.x) * 0.02;
            camera.position.y += (-mouseY * 2 - camera.position.y) * 0.02;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        // UI Event Listeners & Buttons Logic
        document.getElementById('btn-quote').addEventListener('click', () => {
            currentQuoteIdx = (currentQuoteIdx + 1) % quotes.length;
            const quoteEl = document.getElementById('quote-text');
            quoteEl.style.opacity = '0';
            setTimeout(() => {
                quoteEl.innerText = quotes[currentQuoteIdx];
                quoteEl.style.opacity = '1';
            }, 200);
        });

        document.getElementById('btn-color').addEventListener('click', () => {
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            const theme = themes[currentThemeIdx];

            // Update UI Dot Color
            document.getElementById('color-dot').style.backgroundColor = theme.hexStr;
            document.getElementById('color-dot').style.boxShadow = `0 0 10px ${theme.hexStr}`;

            // Re-color 3D Heart Particles
            if (heartParticles) {
                const baseColor = new THREE.Color(theme.primary);
                const secColor = new THREE.Color(theme.secondary);
                const colors = heartParticles.geometry.attributes.color.array;

                for (let i = 0; i < colors.length; i += 3) {
                    const mixRatio = Math.random();
                    const c = baseColor.clone().lerp(secColor, mixRatio);
                    colors[i] = c.r;
                    colors[i + 1] = c.g;
                    colors[i + 2] = c.b;
                }
                heartParticles.geometry.attributes.color.needsUpdate = true;
            }

            // Update Nebula background color
            if (nebulaCloud) {
                nebulaCloud.material.color.setHex(theme.bgGlow);
            }
        });

        document.getElementById('btn-speed').addEventListener('click', () => {
            currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
            document.getElementById('speed-label').innerText = speeds[currentSpeedIdx].label;
        });

        // Initialize on Window Load
        window.onload = function() {
            initThreeJS();
        };
    </script>
</body>
</html>
